name: Collect prices

on:
  schedule:
    - cron: "17 5 * * *"   # varje dag kl 05:17 UTC
  workflow_dispatch:        # gör att du kan starta den manuellt för test

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests brotli

      - name: Fetch prices
        run: python src/fetch_skinport.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.db
          git diff --staged --quiet || git commit -m "Update prices $(date -u +%Y-%m-%d)"
          git push